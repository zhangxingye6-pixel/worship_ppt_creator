when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  build-macos-x86_64:
    image: maven:3.9-eclipse-temurin-17
    commands:
      - apt-get update && apt-get install -y curl tar xz-utils
      - curl -L -o /tmp/mac-jdk.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_x64_mac_hotspot_17.0.11_9.tar.gz"
      - mkdir -p /opt/mac-jdk
      - tar xzf /tmp/mac-jdk.tar.gz -C /opt/mac-jdk --strip-components=1
      - mvn clean package -Pmac-intel -DskipTests -Dmac.jdk.path=/opt/mac-jdk/Contents/Home
      - |
        ZIP_FILE=$(find target -name "*.zip" -type f | head -1)
        if [ -n "$ZIP_FILE" ]; then
          mv "$ZIP_FILE" target/worship-ppt-creator-macos-intel.zip
        fi

  upload-artifact:
    image: alpine:latest
    commands:
      - apk add --no-cache curl
      - |
        OWNER="${CI_REPO%%/*}"
        echo "Uploading artifact to Codeberg Packages..."
        echo "Download: https://codeberg.org/${CI_REPO}/packages"
        VERSION="${CI_COMMIT_SHA:0:8}"
        echo "Uploading to: https://codeberg.org/api/packages/${OWNER}/generic/worship-ppt-creator/${VERSION}/worship-ppt-creator-macos-intel.zip"
        curl -s --user ":$CODEBERG_TOKEN" \
          --upload-file "target/worship-ppt-creator-macos-intel.zip" \
          "https://codeberg.org/api/packages/${OWNER}/generic/worship-ppt-creator/${VERSION}/worship-ppt-creator-macos-intel.zip" \
          -w "\nHTTP_CODE:%{http_code}" -o /tmp/pkg_response.txt
        echo "Response: $(cat /tmp/pkg_response.txt)"
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token

  upload-to-tag:
    image: alpine:latest
    commands:
      - apk add --no-cache curl
      - |
        OWNER="${CI_REPO%%/*}"
        echo "Uploading artifact to Codeberg Packages (tag: $CI_COMMIT_TAG)..."
        echo "Download: https://codeberg.org/${CI_REPO}/packages"
        curl -s --user ":$CODEBERG_TOKEN" \
          --upload-file "target/worship-ppt-creator-macos-intel.zip" \
          "https://codeberg.org/api/packages/${OWNER}/generic/worship-ppt-creator/${CI_COMMIT_TAG}/worship-ppt-creator-macos-intel.zip" \
          -w "\nHTTP_CODE:%{http_code}" -o /tmp/pkg_response.txt
        echo "Response: $(cat /tmp/pkg_response.txt)"
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    when:
      - event: tag
