when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  build-macos-x86_64:
    image: maven:3.9-eclipse-temurin-17
    commands:
      - apt-get update && apt-get install -y curl tar xz-utils
      - curl -L -o /tmp/mac-jdk.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_x64_mac_hotspot_17.0.11_9.tar.gz"
      - mkdir -p /opt/mac-jdk
      - tar xzf /tmp/mac-jdk.tar.gz -C /opt/mac-jdk --strip-components=1
      - mvn clean package -Pmac-intel -DskipTests -Dmac.jdk.path=/opt/mac-jdk/Contents/Home -Drevision=${CI_COMMIT_TAG:-v0.0.0-dev}
      - |
        ZIP_FILE=$(find target -name "*.zip" -type f | head -1)
        if [ -n "$ZIP_FILE" ]; then
          mv "$ZIP_FILE" target/worship-ppt-creator-macos-intel.zip
        fi

  upload:
    image: alpine:latest
    commands:
      - apk add --no-cache curl
      - |
        if [ -z "$CI_COMMIT_TAG" ]; then
          echo "Skipping package upload: this is not a tag build."
          exit 0
        fi
        if ! echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Skipping package upload: $CI_COMMIT_TAG is not a final release tag."
          exit 0
        fi

        OWNER=$(echo "$CI_REPO" | cut -d/ -f1)
        VERSION="$CI_COMMIT_TAG"
        echo "Uploading release artifact (tag: $VERSION)..."
        echo "Owner: [$OWNER]"
        echo "Version: [$VERSION]"
        echo "Download: https://codeberg.org/$CI_REPO/packages"
        FILE_NAME="worship-ppt-creator-macos-intel-$VERSION.zip"
        cp target/worship-ppt-creator-macos-intel.zip "target/$FILE_NAME"
        U="https://codeberg.org/api/packages/$OWNER/generic/worship-ppt-creator/$VERSION/$FILE_NAME"
        echo "Uploading to: $U"
        curl --fail-with-body -s --user ":$CODEBERG_TOKEN" --upload-file "target/$FILE_NAME" "$U" \
          -w "\nHTTP_CODE:%{http_code}" -o /tmp/pkg_response.txt
        echo "Response: $(cat /tmp/pkg_response.txt)"
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
