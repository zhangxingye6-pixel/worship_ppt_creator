name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            profile: windows
            artifact: worship-ppt-creator-windows

          - os: macos-15-intel
            profile: mac-native
            artifact: worship-ppt-creator-macos-intel

          - os: macos-15
            profile: mac-native
            artifact: worship-ppt-creator-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d+\.\d+\.\d+$') {
            "is_final=true" >> $env:GITHUB_OUTPUT
            "is_rc=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($tag -match '^v\d+\.\d+\.\d+-rc\.\d+$') {
            "is_final=false" >> $env:GITHUB_OUTPUT
            "is_rc=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Error "Release tags must look like v1.2.3 or v1.2.3-rc.1. Got: $tag"
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: mvn clean package -P${{ matrix.profile }} -DskipTests "-Drevision=${{ github.ref_name }}"

      - name: Fix macOS permissions
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          if [ "${{ matrix.artifact }}" = "worship-ppt-creator-macos-arm64" ] && [ "$ARCH" != "arm64" ]; then
            echo "Expected an ARM64 runner, got $ARCH"
            exit 1
          fi
          if [ "${{ matrix.artifact }}" = "worship-ppt-creator-macos-intel" ] && [ "$ARCH" != "x86_64" ]; then
            echo "Expected an Intel runner, got $ARCH"
            exit 1
          fi

          APP_DIR=$(find target -name "*.app" -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            chmod +x "$APP_DIR/Contents/MacOS/universalJavaApplicationStub" || true
            chmod -R +x "$APP_DIR/Contents/PlugIns/jre.jre/Contents/Home/bin" || true
          fi

      - name: Rename artifact
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem -Path "target" -Filter "*.zip" | Select-Object -First 1
          if (-not $zipFile) {
            Write-Error "No zip file found in target/"
            exit 1
          }
          Rename-Item -LiteralPath $zipFile.FullName -NewName "${{ matrix.artifact }}-${{ github.ref_name }}.zip" -ErrorAction Stop

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: target/${{ matrix.artifact }}-${{ github.ref_name }}.zip
          retention-days: 14

  release:
    if: needs.build.result == 'success' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: worship-ppt-creator-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Upload all artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
