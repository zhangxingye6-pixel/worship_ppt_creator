name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            profile: windows
            artifact: worship-ppt-creator-windows.zip

          - os: macos-15-intel
            profile: mac-native
            artifact: worship-ppt-creator-macos-intel.zip

          - os: macos-14
            profile: mac-native
            artifact: worship-ppt-creator-macos-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d+\.\d+\.\d+$') {
            "is_final=true" >> $env:GITHUB_OUTPUT
            "is_rc=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($tag -match '^v\d+\.\d+\.\d+-rc\.\d+$') {
            "is_final=false" >> $env:GITHUB_OUTPUT
            "is_rc=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Error "Release tags must look like v1.2.3 or v1.2.3-rc.1. Got: $tag"
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: mvn clean package -P${{ matrix.profile }} -DskipTests "-Drevision=${{ github.ref_name }}"

      - name: Fix macOS permissions
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find target -name "*.app" -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            chmod +x "$APP_DIR/Contents/MacOS/universalJavaApplicationStub" || true
            chmod -R +x "$APP_DIR/Contents/PlugIns/jre.jre/Contents/Home/bin" || true
          fi

      - name: Rename artifact
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem -Path "target" -Filter "*.zip" | Select-Object -First 1
          if (-not $zipFile) {
            Write-Error "No zip file found in target/"
            exit 1
          }
          Rename-Item -LiteralPath $zipFile.FullName -NewName "${{ matrix.artifact }}" -ErrorAction Stop

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}
          retention-days: 14

      - name: Upload to Release
        if: steps.tag.outputs.is_final == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.artifact }}
