name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download macOS Intel JDK (Windows)
        shell: bash
        run: |
          mkdir -p mac-intel-jdk
          curl -L "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9/OpenJDK17U-jdk_x64_mac_hotspot_17.0.9_9.tar.gz" -o mac-intel-jdk/jdk.tar.gz
          tar -xzf mac-intel-jdk/jdk.tar.gz -C mac-intel-jdk --strip-components=1
        if: matrix.os == 'windows-latest'

      - name: Build Windows version
        run: mvn clean package -Pwindows
        if: matrix.os == 'windows-latest'

      - name: Build macOS Intel version (cross-compile from Windows)
        run: mvn clean package -Pmac-intel -Dmac.jdk.path="${{ github.workspace }}/mac-intel-jdk"
        if: matrix.os == 'windows-latest'

      - name: Build macOS ARM version (native)
        run: mvn clean package
        if: matrix.os == 'macos-latest'

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
