name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Windows version
        run: mvn clean package -Pwindows -DskipTests

      - name: Rename artifact
        shell: pwsh
        run: |
          cd target
          $zipFile = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          if ($zipFile) {
            Rename-Item $zipFile.FullName "worship-ppt-creator-windows.zip"
          } else {
            exit 1
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/worship-ppt-creator-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build macOS Intel
        run: mvn clean package -Pmac-native -DskipTests

      - name: Fix permissions
        run: |
          APP_DIR=$(find target -name "*.app" -type d | head -1)
          chmod +x "$APP_DIR/Contents/MacOS/universalJavaApplicationStub" || true
          chmod -R +x "$APP_DIR/Contents/PlugIns/jre.jre/Contents/Home/bin" || true

      - name: Rename artifact
        run: |
          cd target
          mv *.zip worship-ppt-creator-macos-intel.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/worship-ppt-creator-macos-intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build macOS ARM
        run: mvn clean package -Pmac-native -DskipTests

      - name: Fix permissions
        run: |
          APP_DIR=$(find target -name "*.app" -type d | head -1)
          chmod +x "$APP_DIR/Contents/MacOS/universalJavaApplicationStub" || true
          chmod -R +x "$APP_DIR/Contents/PlugIns/jre.jre/Contents/Home/bin" || true

      - name: Rename artifact
        run: |
          cd target
          mv *.zip worship-ppt-creator-macos-arm64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/worship-ppt-creator-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
