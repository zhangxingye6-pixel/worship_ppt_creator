name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            profile: windows
            artifact: worship-ppt-creator-windows.zip

          - os: macos-13
            profile: mac-native
            artifact: worship-ppt-creator-macos-intel.zip

          - os: macos-14
            profile: mac-native
            artifact: worship-ppt-creator-macos-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: mvn clean package -P${{ matrix.profile }} -DskipTests

      - name: Fix macOS permissions
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find target -name "*.app" -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            chmod +x "$APP_DIR/Contents/MacOS/universalJavaApplicationStub" || true
            chmod -R +x "$APP_DIR/Contents/PlugIns/jre.jre/Contents/Home/bin" || true
          fi

      - name: Rename artifact
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem -Path "target" -Filter "*.zip" | Select-Object -First 1
          if (-not $zipFile) {
            Write-Error "No zip file found in target/"
            exit 1
          }
          Rename-Item -LiteralPath $zipFile.FullName -NewName "${{ matrix.artifact }}" -ErrorAction Stop

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.artifact }}
