stages:
  - build

variables:
  MAVEN_CLI_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository --batch-mode"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/

macos-x86_64:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - apt-get update && apt-get install -y curl tar xz-utils
    - curl -L -o /tmp/mac-jdk.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_x64_mac_hotspot_17.0.11_9.tar.gz"
    - mkdir -p /opt/mac-jdk
    - tar xzf /tmp/mac-jdk.tar.gz -C /opt/mac-jdk --strip-components=1
  script:
    - mvn clean package -Pmac-intel -DskipTests -Dmac.jdk.path=/opt/mac-jdk/Contents/Home
  after_script:
    - |
      ZIP_FILE=$(find target -name "*.zip" -type f | head -1)
      if [ -n "$ZIP_FILE" ]; then
        mv "$ZIP_FILE" target/worship-ppt-creator-macos-intel.zip
      fi
  artifacts:
    paths:
      - target/worship-ppt-creator-macos-intel.zip
    expire_in: never

